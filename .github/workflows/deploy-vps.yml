name: Deploy Portfolio VPS
on: {workflow_dispatch: {}}
permissions: {contents: read}
concurrency: {group: portfolio-production, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
    steps:
      - uses: actions/checkout@v5
      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"; test -n "$VPS_USER"; test -n "${{ secrets.VPS_SSH_KEY }}"
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Package
        run: tar --exclude='.git' --exclude='.github' --exclude='infra' --exclude='scripts' --exclude='v1' -czf "/tmp/${GITHUB_SHA}.tar.gz" .
      - name: Deploy atomic release
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          scp -P "$PORT" "/tmp/${GITHUB_SHA}.tar.gz" "$VPS_USER@$VPS_HOST:/tmp/${GITHUB_SHA}.tar.gz"
          ssh -p "$PORT" "$VPS_USER@$VPS_HOST" bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          SHA="$1"; ROOT="/srv/portfolio"; RELEASE="$ROOT/releases/$SHA"
          mkdir -p "$RELEASE"; tar -xzf "/tmp/$SHA.tar.gz" -C "$RELEASE"
          ln -sfn "$RELEASE" "$ROOT/current.new"; mv -Tf "$ROOT/current.new" "$ROOT/current"
          test -s "$ROOT/current/index.html"
          rm -f "/tmp/$SHA.tar.gz"
          find "$ROOT/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | tail -n +6 | cut -d' ' -f2- | xargs -r rm -rf
          REMOTE
      - name: Health check
        run: |
          URL="${{ secrets.PORTFOLIO_HEALTHCHECK_URL }}"; test -n "$URL"
          for i in 1 2 3 4 5; do curl -fsS --max-time 15 "$URL" >/dev/null && exit 0; sleep 3; done
          exit 1
