server {
 listen 80; listen [::]:80; server_name portfolio.galaclab.com;
 root /srv/portfolio/current; index index.html;
 location / { try_files $uri $uri/ $uri/index.html =404; }
 location ~* \.(png|jpg|jpeg|webp|svg|ico)$ { expires 7d; add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }
 location ~* \.(css|js)$ { expires 1h; add_header Cache-Control "public, max-age=3600, must-revalidate"; try_files $uri =404; }
 location ~* \.(html|xml|txt|pdf)$ { expires -1; add_header Cache-Control "no-cache, must-revalidate"; try_files $uri $uri/ =404; }
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
}
